name: deploy

# Thin caller workflow. This file is NOT trusted by the platform — an app
# author can edit or delete it. All the platform's security gates and the
# deploy step itself live in the reusable workflow this invokes
# (`dlaporte/inno-platform-ci`'s `platform-ci.yml`, the public contract
# mirror), which an app repo cannot
# edit. The broker verifies (server-side, via the GitHub OIDC token's
# job_workflow_ref claim) that a deploy-token request actually came from
# that exact reusable workflow running off `main` — a repo that replaces
# this caller with something else gets refused a deploy token.
# RELEASE-DRIVEN: a push to main runs the platform's safety gates and STOPS
# (your safety preflight — nothing deploys). Tagging a v* release is what
# deploys: the reusable workflow's deploy job and the broker both key on the
# tag ref. /inno-ship handles the tagging for you.
on:
  push:
    branches: [main]
    tags: ["v*"]
  # Lets the platform's safety sweep respin this app (an automatic rebuild at
  # your RELEASED tag when a new CVE is found in the deployed image). Removing
  # this only breaks YOUR app's auto-respin (the platform audits the failure
  # and notifies admins).
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

# Adapting this platform to your own accounts? Re-point the `uses:` ref below
# at YOUR copy of the public inno-platform-ci mirror (OPERATIONS 4.6 step 6).
# The platform reads your app name from "with: app:" and otherwise from this
# repository's name minus any inno- prefix; either must match
# ^[a-z][a-z0-9-]{2,28}$ or the run fails before any gate. If your repository
# is not named after your app, add these two lines right after the uses: line
# below, with "with:" at the same indentation as "uses:" (a sibling key, not
# nested under it), as the deploy.yml that register_app hands you does:
#     with:
#       app: <your app name>
jobs:
  platform:
    # Skip on the template repo itself (is_template=true): the template is not
    # a deployable app — it has no registry entry with the platform, so running
    # CI there can only fail. Repos GENERATED from the template are not
    # template repos and run normally.
    if: ${{ !github.event.repository.is_template }}
    uses: dlaporte/inno-platform-ci/.github/workflows/platform-ci.yml@main
    # No secrets are passed, on purpose: do not add a secrets: line. The
    # platform workflow declares no workflow_call secrets, and the only one it
    # reads is GITHUB_TOKEN, which GitHub gives every called workflow on its
    # own. Inheriting would hand every secret in this repo to the mirror's
    # workflow, and the platform's SAST gate (semgrep rule
    # yaml.github-actions.security.secrets-inherit) fails the build on it.
